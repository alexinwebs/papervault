name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway database and secret so the build and tests are hermetic.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/papervault?schema=public"
  AUTH_SECRET: "ci-only-secret-value-that-is-long-enough-000000"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  STORAGE_DIR: "./storage"
  CRON_SECRET: "local-cron-secret"

jobs:
  verify:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: papervault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # Fails if schema.prisma changed without a matching migration.
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://postgres:postgres@localhost:5432/postgres" --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Concurrency regression for the duplicate guard (needs the Postgres service).
      - run: npm run test:integration

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    env:
      # The suite signs in and registers far more often than people do.
      LOGIN_ATTEMPTS_PER_MINUTE: "120"
      REGISTRATIONS_PER_IP_PER_HOUR: "1000"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: papervault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on a high or critical advisory in anything that ships to
      # production. Build-only tooling advisories are tracked in docs/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
